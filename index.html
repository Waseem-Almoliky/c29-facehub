<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f1113">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>FaceHub</title>
<script src="i18n.js"></script>
<style>
:root{--bg:#0f1113;--panel:#181b1f;--line:#272b30;--ink:#ecebe4;--mute:#8d928f;--accent:#B3AE5E;--accent-ink:#1a1a10;--bad:#e0645c;--ok:#8fc77a;
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-size:15px}
header{position:sticky;top:0;z-index:5;background:var(--bg);padding:calc(env(safe-area-inset-top) + 12px) 16px 10px;display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--line)}
h1{font-size:18px;margin:0;flex:1}h1 b{color:var(--accent)}
.pill{font-size:12px;padding:6px 11px;border-radius:999px;background:var(--panel);border:1px solid var(--line);color:var(--mute);white-space:nowrap}
.pill.on{color:var(--ok);border-color:#34452e}
main{padding:14px 16px calc(env(safe-area-inset-bottom) + 90px)}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:#121417;border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom);z-index:6}
nav button{flex:1;background:none;border:0;color:var(--mute);font:inherit;font-size:12px;padding:10px 0 12px;display:flex;flex-direction:column;align-items:center;gap:3px}
nav button.on{color:var(--accent)}nav svg{width:22px;height:22px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(100px,1fr));gap:14px 12px}
.card{text-align:center;cursor:pointer}
.dial{width:100%;aspect-ratio:1;border-radius:50%;background:#000 center/cover no-repeat;box-shadow:0 0 0 4px #24282c,0 0 0 5px #363b40;display:grid;place-items:center;color:#555;font-size:22px}
.card.sel .dial{box-shadow:0 0 0 4px var(--accent),0 0 0 5px #363b40}
.nm{font-size:12px;margin-top:9px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sub{font-size:11px;color:var(--mute)}
h2{font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--mute);margin:20px 0 12px}
h2:first-child{margin-top:4px}
.chips{display:flex;gap:7px;overflow-x:auto;padding-bottom:6px;margin-bottom:10px;scrollbar-width:none}
.chip{flex:none;background:var(--panel);border:1px solid var(--line);color:var(--ink);padding:7px 13px;border-radius:999px;font:inherit;font-size:13px}
.chip.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn{display:block;width:100%;padding:13px;border-radius:12px;border:0;font:inherit;font-weight:600;margin-bottom:10px}
.btn.primary{background:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:var(--panel);color:var(--ink);border:1px solid var(--line)}
.btn.danger{background:none;color:var(--bad);border:1px solid #4a2b2a}
.btn:disabled{opacity:.5}
.box{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
.hint{font-size:13px;color:var(--mute);line-height:1.5;margin:0 0 10px}
.empty{color:var(--mute);text-align:center;padding:36px 10px;line-height:1.6}
.sheet-bg{position:fixed;inset:0;background:#000a;z-index:10;display:flex;align-items:flex-end}
.sheet{background:#15181b;width:100%;max-height:92vh;overflow:auto;border-radius:20px 20px 0 0;padding:14px 18px calc(env(safe-area-inset-bottom) + 18px);border-top:1px solid var(--line)}
.grab{width:40px;height:4px;border-radius:2px;background:#3a3f45;margin:0 auto 14px}
.big{width:62%;max-width:260px;margin:4px auto 16px}.big .dial{box-shadow:0 0 0 8px #24282c,0 0 0 10px #3a3f45,0 14px 40px #000a}
.title{font-size:18px;font-weight:600;text-align:center}.meta{text-align:center;color:var(--mute);font-size:12px;margin:4px 0 16px}
.sw{display:flex;gap:9px;flex-wrap:wrap;margin-bottom:12px;align-items:center}
.sw i{width:30px;height:30px;border-radius:50%;border:2px solid transparent;display:block}
.sw i.on{border-color:var(--ink)}
input[type=color]{width:36px;height:32px;border:0;background:none;padding:0}
input[type=number]{background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:8px;font:inherit;width:120px}
.bar{height:6px;background:#262a2f;border-radius:4px;overflow:hidden;margin:8px 0}.bar i{display:block;height:100%;background:var(--accent);width:0;transition:width .25s}
pre{font-size:11px;color:var(--mute);white-space:pre-wrap;margin:6px 0 0;max-height:120px;overflow:auto}
.toast{position:fixed;left:16px;right:16px;bottom:calc(env(safe-area-inset-bottom) + 78px);background:#262a2f;border:1px solid #3a3f45;padding:12px 14px;border-radius:12px;z-index:20;font-size:14px}
.warn{border-color:#5a4a26;background:#221d12}
</style>
</head>
<body>
<header>
  <h1>Face<b>Hub</b></h1>
  <button class="lang-btn" id="lang">عربي</button>
  <button class="pill" id="conn">Connect watch</button>
</header>
<main id="main"></main>
<nav>
  <button data-tab="watch" class="on"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="6.5"/><path d="M9 5.5 9.6 2h4.8l.6 3.5M9 18.5l.6 3.5h4.8l.6-3.5M12 9.5V12l1.6 1.2"/></svg><span data-i18n="Watch">Watch</span></button>
  <button data-tab="library"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3.5" y="3.5" width="7" height="7" rx="3.5"/><rect x="13.5" y="3.5" width="7" height="7" rx="3.5"/><rect x="3.5" y="13.5" width="7" height="7" rx="3.5"/><path d="M17 14v6M14 17h6"/></svg><span data-i18n="My faces">My faces</span></button>
  <button data-tab="store"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 8h16l-1.3 11.2a2 2 0 0 1-2 1.8H7.3a2 2 0 0 1-2-1.8z"/><path d="M8.5 8V6.5a3.5 3.5 0 0 1 7 0V8"/></svg><span data-i18n="Store">Store</span></button>
</nav>
<input type="file" id="file" accept=".bin,application/octet-stream" multiple hidden>
<script src="colorpick.js"></script>
<script type="module" src="app.js"></script>
</body>
</html>
